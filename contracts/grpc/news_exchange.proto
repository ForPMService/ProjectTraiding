syntax = "proto3";
package projecttraiding.news.v1;
option csharp_namespace = "ProjectTraiding.Europe.Grpc";

service NewsExchange {
  rpc WatchSnapshots(WatchSnapshotsRequest) returns (stream SnapshotMessage);
  rpc SubmitResult(ResultMessage) returns (ResultAcknowledgement);
}

message WatchSnapshotsRequest {}
message SnapshotMessage { bytes snapshot_json = 1; }
message ResultMessage {
  string delivery_id = 1;
  bytes result_json = 2;
}
message ResultAcknowledgement {
  string delivery_id = 1;
  bool accepted = 2;
}
