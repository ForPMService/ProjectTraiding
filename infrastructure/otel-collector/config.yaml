# OpenTelemetry Collector — конфигурация для ProjectTraiding.
# Шаг 2.3: экспортеры в LGTM.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Ограничитель памяти. У контейнера сборщика нет внешнего ограничения,
  # поэтому это единственный настроенный механизм обратного давления по памяти —
  # но не жёсткий предел процесса: между проверками и во время сборки мусора
  # потребление может временно оказаться выше заданного значения.
  #
  # Мягкий порог = limit_mib - spike_limit_mib = 384 МБ. С него сборщик начинает
  # отказывать в приёме данных ошибкой, допускающей повтор. Будет ли повтор
  # выполнен и потеряются ли данные, зависит от политики отправителя и его
  # очереди, а не от этого процессора.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  batch:

exporters:
  # Loki — логи через OTLP.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  # Prometheus — Collector открывает scrape endpoint.
  # Prometheus scrape-ит otel-collector:8889.
  prometheus:
    endpoint: 0.0.0.0:8889

  # Tempo — трейсы через OTLP gRPC.
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
