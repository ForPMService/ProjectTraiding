# Flyway — проект миграций столбцовой базы ProjectTraiding (ClickHouse).
# Отдельный проект рядом с существующим проектом миграций PostgreSQL.
# Подключение к ClickHouse по HTTP через драйвер JDBC.
#
# Предпосылки:
#   1. ClickHouse поднят (Docker Compose), HTTP-порт 8123.
#   2. Драйвер ClickHouse JDBC (com.clickhouse:clickhouse-jdbc, сборка "all"/"shaded")
#      лежит в каталоге drivers/ дистрибутива Flyway — так же, как драйвер PostgreSQL.
#
# Запуск:  flyway -configFiles=flyway.conf migrate
#          flyway -configFiles=flyway.conf info

flyway.url=jdbc:clickhouse://localhost:8123/projecttraiding
flyway.user=projecttraiding
flyway.password=projecttraiding

flyway.locations=filesystem:migrations

# База данных ClickHouse, в которой живут таблицы и таблица истории Flyway.
# createSchemas=true заставляет Flyway создать её, если её ещё нет.
flyway.defaultSchema=projecttraiding
flyway.schemas=projecttraiding
flyway.createSchemas=true

# В ClickHouse нет многооператорных транзакций: миграции выполняются без
# транзакционного отката. Поэтому держим одну операцию CREATE TABLE на миграцию —
# тогда сбой локализован, а повтор однозначен. Таблицу истории Flyway создаёт сам.
flyway.executeInTransaction=false

jarDirs=C:/Program Files/Red Gate/Flyway Desktop/drivers
#communityDBSupportEnabled=true
