apiVersion: 1

# Правила тревог удаляются из системы. Это не описание правил, а указание Grafana
# удалить ранее розданные: правила записаны в её базу с признаком происхождения
# «файл» и из интерфейса не удаляются, а простое удаление файла их не убирает.
#
# Файл остаётся в репозитории: указание выполняется при очередном перезапуске
# Grafana, а до него правила продолжают числиться в её базе.
deleteRules:
  - orgId: 1
    uid: pt-operations-error-ratio
  - orgId: 1
    uid: pt-app-heartbeat-stale
