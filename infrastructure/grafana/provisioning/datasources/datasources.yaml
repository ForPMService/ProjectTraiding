# Grafana — provisioned datasources.
# Автоматически загружаются при старте Grafana.
# Версия 2: явные UID + исправленный derived field для OTLP trace_id.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        # OTLP-логи хранят trace_id в structured metadata, не в теле строки.
        # matcherType: label — ищет по полю/метке, а не по regex в тексте.
        - datasourceUid: tempo
          matcherType: label
          name: trace_id
          matcherRegex: "(.+)"
          url: "$${__value.raw}"
          urlDisplayLabel: View Trace

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
      nodeGraph:
        enabled: true
      tracesToMetrics:
        datasourceUid: prometheus
