# Grafana — provisioned dashboards.
# JSON-файлы дашбордов загружаются из /etc/grafana/provisioning/dashboards/
# Дашборды создаются на шаге 2.4.

apiVersion: 1

providers:
  - name: ProjectTraiding
    orgId: 1
    folder: ProjectTraiding
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
