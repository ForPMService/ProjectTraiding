x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.4
    logging: *default-logging
    container_name: projecttraiding-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projecttraiding}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projecttraiding}
      POSTGRES_DB: ${POSTGRES_DB:-projecttraiding}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ══════════════════════════════════════════════
  # OpenTelemetry Collector
  # Принимает OTLP от приложения, маршрутизирует в LGTM.
  # Образ contrib — экспортеры Loki/Prometheus.
  # ══════════════════════════════════════════════
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    logging: *default-logging
    container_name: projecttraiding-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:13133:13133"
    volumes:
      - ./otel-collector:/etc/otel:ro
    depends_on:
      - loki
      - tempo

  # ══════════════════════════════════════════════
  # Loki — хранилище логов
  # ══════════════════════════════════════════════
  loki:
    image: grafana/loki:3.7.0
    logging: *default-logging
    container_name: projecttraiding-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki:/etc/loki:ro
      - lokidata:/loki
    command: -config.file=/etc/loki/config.yaml

  # ══════════════════════════════════════════════
  # Prometheus — хранилище метрик
  # Scrape-ит otel-collector:8889.
  # ══════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v3.3.0
    container_name: projecttraiding-prometheus
    logging: *default-logging
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --storage.tsdb.retention.time=90d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus

  # ══════════════════════════════════════════════
  # Tempo — хранилище трейсов
  # ══════════════════════════════════════════════
  tempo:
    image: grafana/tempo:2.7.0
    logging: *default-logging
    container_name: projecttraiding-tempo
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./tempo:/etc/tempo:ro
      - tempodata:/var/tempo
    command: -config.file=/etc/tempo/config.yaml

  # ══════════════════════════════════════════════
  # Grafana — визуализация
  # Datasources и дашборды provisioned из репозитория.
  # ══════════════════════════════════════════════
  grafana:
    image: grafana/grafana:13.1.0
    logging: *default-logging
    container_name: projecttraiding-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_INSTALL_PLUGINS: "grafana-lokiexplore-app,grafana-exploretraces-app,grafana-metricsdrilldown-app"
    depends_on:
      - loki
      - prometheus
      - tempo

  clickhouse:
    image: clickhouse/clickhouse-server:26.5
    logging: *default-logging
    container_name: projecttraiding-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-projecttraiding}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-projecttraiding}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-projecttraiding}
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhousedata:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
      image: redis:8.8.0
      logging: *default-logging
      container_name: projecttraiding-redis
      restart: unless-stopped
      command:
        - redis-server
        - --requirepass
        - ${REDIS_PASSWORD:-projecttraiding}
        - --maxmemory
        - ${REDIS_MAXMEMORY:-512mb}
        - --maxmemory-policy
        - noeviction
        - --save
        - ""
        - --appendonly
        - "no"
        - --protected-mode
        - "yes"
      ports:
        - "127.0.0.1:${REDIS_PORT:-6379}:6379"
      environment:
        REDISCLI_AUTH: ${REDIS_PASSWORD:-projecttraiding}
      healthcheck:
        test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
        interval: 10s
        timeout: 3s
        retries: 5

volumes:
  pgdata:
  lokidata:
  prometheusdata:
  tempodata:
  grafanadata:
  clickhousedata:
