services:
  postgres:
    image: postgres:18.4
    container_name: projecttraiding-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projecttraiding}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projecttraiding}
      POSTGRES_DB: ${POSTGRES_DB:-projecttraiding}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
