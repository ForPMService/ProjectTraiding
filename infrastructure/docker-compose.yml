services:
  postgres:
    image: postgres:18.4
    container_name: projecttraiding-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projecttraiding}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projecttraiding}
      POSTGRES_DB: ${POSTGRES_DB:-projecttraiding}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projecttraiding -d projecttraiding"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
