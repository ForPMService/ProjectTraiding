# Tempo — single-process mode для Docker Compose.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    # Глубина хранения трасс. Умолчание — четырнадцать суток; трёх достаточно
    # для разбора недавнего случая, а объём на локальном диске ниже впятеро.
    block_retention: 72h
